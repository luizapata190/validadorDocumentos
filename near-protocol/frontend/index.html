<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notario Digital NEAR (API Backend)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f9f5;
            display: flex;
            justify-content: center;
            padding: 30px;
            margin: 0;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            margin-top: 10px;
            width: 100%;
        }

        .btn-green {
            background-color: #00c08b;
        }

        .btn-blue {
            background-color: #007bff;
        }

        .card {
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }

        .card-register {
            border: 2px dashed #00c08b;
            background-color: #fafdfb;
        }

        .card-verify {
            border: 2px solid #007bff;
            background-color: #f8fbff;
        }

        input[type="file"] {
            margin: 15px 0;
            display: block;
            width: 100%;
        }

        .status-box {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Notario Interno NEAR 🟢</h1>
        <p>El servidor firma las transacciones automáticamente.</p>

        <!-- Módulo 1: Registrar -->
        <div class="card card-register">
            <h3>📝 Registrar Documento</h3>
            <input type="file" id="regFile">
            <button id="btnReg" class="btn btn-green">Registrar en la Blockchain</button>
            <div id="statusReg" class="status-box"></div>
        </div>

        <!-- Módulo 2: Validar -->
        <div class="card card-verify">
            <h3>🔍 Validar Documento</h3>
            <input type="file" id="verFile">
            <button id="btnVer" class="btn btn-blue">Validar Documento</button>
            <div id="statusVer" class="status-box"></div>
        </div>
    </div>

    <script>
        // URL de tu Backend en Linux (Si usas puertos reenviados, déjalo en localhost:3000)
        const BACKEND_URL = "http://localhost:3000/api";

        // Función para calcular SHA-256 localmente
        async function calcularHash(file) {
            const arrayBuffer = await file.arrayBuffer();
            const hashBuffer = await crypto.subtle.digest('SHA-256', arrayBuffer);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // REGISTRAR
        document.getElementById('btnReg').addEventListener('click', async () => {
            const file = document.getElementById('regFile').files[0];
            if (!file) return alert("Sube un archivo.");

            document.getElementById('statusReg').innerText = "Enviando al servidor Linux...";
            document.getElementById('statusReg').style.color = "#007bff";

            const hash = await calcularHash(file);

            try {
                const res = await fetch(`${BACKEND_URL}/registrar`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ hashDocumento: hash })
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('statusReg').style.color = "green";
                    document.getElementById('statusReg').innerHTML = `✅ Registrado.<br>TxID: <a href="https://testnet.nearblocks.io/txns/${data.transactionId}" target="_blank">Ver en Explorador</a>`;
                } else {
                    throw new Error(data.error);
                }
            } catch (e) {
                document.getElementById('statusReg').style.color = "red";
                document.getElementById('statusReg').innerText = "Error: " + e.message;
            }
        });

        // VERIFICAR
        document.getElementById('btnVer').addEventListener('click', async () => {
            const file = document.getElementById('verFile').files[0];
            if (!file) return alert("Sube un archivo.");

            document.getElementById('statusVer').innerText = "Consultando al servidor...";
            document.getElementById('statusVer').style.color = "#007bff";

            const hash = await calcularHash(file);

            try {
                const res = await fetch(`${BACKEND_URL}/verificar/${hash}`);
                const data = await res.json();

                if (data.success && data.data.estaRegistrado) {
                    document.getElementById('statusVer').style.color = "green";
                    document.getElementById('statusVer').innerHTML = `✅ <b>DOCUMENTO AUTÉNTICO</b><br>Hash: ${hash}`;
                } else {
                    document.getElementById('statusVer').style.color = "red";
                    document.getElementById('statusVer').innerText = "❌ Documento NO registrado.";
                }
            } catch (e) {
                document.getElementById('statusVer').style.color = "red";
                document.getElementById('statusVer').innerText = "Error: " + e.message;
            }
        });
    </script>
</body>

</html>
